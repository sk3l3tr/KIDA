
name: KIDA CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: kida
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust checks
        run: |
          docker run --rm \
            -e CARGO_HOME=/tmp/cargo \
            -e CARGO_TARGET_DIR=/tmp/kida-target \
            -v "$PWD:/workspace" \
            -w /workspace \
            rust:1.98.1-bookworm \
            bash -euc '
              rustup component add rustfmt clippy

              echo "==> Format"
              cargo fmt --all -- --check

              echo "==> Clippy"
              cargo clippy --workspace --all-targets --locked -- -D warnings

              echo "==> Tests"
              cargo test --workspace --locked
            '

