name: Build KIDA Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: kida

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Build release
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/workspace" \
            -w /workspace \
            rust:1.98.1-bookworm \
            cargo build --release --locked

      - name: Prepare artifacts
        run: |
          rm -rf dist
          mkdir -p dist

          test -f target/release/kida-core
          test -f target/release/kida-cli

          cp target/release/kida-core dist/kida-core
          cp target/release/kida-cli dist/kida-cli

          chmod 755 dist/kida-core
          chmod 755 dist/kida-cli

      - name: Generate checksums
        run: |
          cd dist
          sha256sum kida-core kida-cli > SHA256SUMS

      - name: Verify artifacts
        run: |
          file dist/kida-core
          file dist/kida-cli

          ./dist/kida-cli --help

          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish package
        env:
          PACKAGE_TOKEN: ${{ secrets.KIDA_PACKAGE_TOKEN }}
          VERSION: ${{ forgejo.ref_name }}
          FORGEJO_USER: sk3l3t0r
        run: |
          set -euo pipefail

          test -n "${PACKAGE_TOKEN}" || {
            echo "KIDA_PACKAGE_TOKEN is empty"
            exit 1
          }

          BASE_URL="http://git.atlantis.arpa/api/packages/${FORGEJO_USER}/generic/kida/${VERSION}"

          for FILE in kida-core kida-cli SHA256SUMS; do
            echo "Publishing ${FILE}..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/forgejo-response \
              --write-out "%{http_code}" \
              --user "${FORGEJO_USER}:${PACKAGE_TOKEN}" \
              --upload-file "dist/${FILE}" \
              "${BASE_URL}/${FILE}")

            if [ "${HTTP_CODE}" != "201" ]; then
              echo "Failed publishing ${FILE}: HTTP ${HTTP_CODE}"
              cat /tmp/forgejo-response
              exit 1
            fi
          done

          echo "KIDA ${VERSION} published successfully."
