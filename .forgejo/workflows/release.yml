name: Build KIDA Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: kida

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Build release
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/workspace" \
            -w /workspace \
            rust:1.98.1-bookworm \
            cargo build --release --locked

      - name: Prepare artifacts
        run: |
          rm -rf dist
          mkdir -p dist

          test -f target/release/kida-core
          test -f target/release/kida-cli

          cp target/release/kida-core dist/kida-core
          cp target/release/kida-cli dist/kida-cli

          chmod 755 dist/kida-core
          chmod 755 dist/kida-cli

      - name: Generate checksums
        run: |
          cd dist
          sha256sum kida-core kida-cli > SHA256SUMS

      - name: Verify artifacts
        run: |
          file dist/kida-core
          file dist/kida-cli

          ./dist/kida-cli --help

          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish package
        env:
          FORGEJO_TOKEN: ${{ secrets.KIDA_PACKAGE_TOKEN }}
          VERSION: ${{ forgejo.ref_name }}
        run: |
          BASE_URL="http://git.atlantis.arpa/api/packages/<TU_USUARIO>/generic/kida/${VERSION}"

          curl --fail --show-error \
            --user "<TU_USUARIO>:${FORGEJO_TOKEN}" \
            --upload-file dist/kida-core \
            "${BASE_URL}/kida-core"

          curl --fail --show-error \
            --user "<TU_USUARIO>:${FORGEJO_TOKEN}" \
            --upload-file dist/kida-cli \
            "${BASE_URL}/kida-cli"

          curl --fail --show-error \
            --user "<TU_USUARIO>:${FORGEJO_TOKEN}" \
            --upload-file dist/SHA256SUMS \
            "${BASE_URL}/SHA256SUMS"
