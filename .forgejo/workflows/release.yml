name: Build KIDA Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: kida

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -v "$PWD:/workspace" \
            -w /workspace \
            rust:1.98.1-bookworm \
            cargo build --release --locked

      - name: Prepare artifacts
        run: |
          rm -rf dist
          mkdir -p dist

          test -f target/release/kida-core
          test -f target/release/kida-cli

          cp target/release/kida-core dist/kida-core
          cp target/release/kida-cli dist/kida-cli

          chmod 755 dist/kida-core
          chmod 755 dist/kida-cli

      - name: Generate checksums
        run: |
          cd dist
          sha256sum kida-core kida-cli > SHA256SUMS

      - name: Verify artifacts
        run: |
          file dist/kida-core
          file dist/kida-cli
          ./dist/kida-cli --help || true
          sha256sum -c dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kida-linux-x86_64
          path: dist/
