<ion-tabs (ionTabsWillChange)="state.leaveTab()">
  <ion-tab-bar slot="top" aria-label="Backups">
    <ion-tab-button tab="configurations" href="/backups/configurations">
      <ion-label>Configuraciones ({{ state.configurations.entries()?.length ?? '—' }})</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="health" href="/backups/health">
      <ion-label>Backup Health ({{ state.health.entries()?.length ?? '—' }})</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="reports" href="/backups/reports">
      <ion-label>Informes ({{ state.reports.entries()?.length ?? '—' }})</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
