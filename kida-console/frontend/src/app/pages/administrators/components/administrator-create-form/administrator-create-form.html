<form #createForm="ngForm" (ngSubmit)="state.create()">
  <label for="create-username">Username nuevo</label>
  <input
    id="create-username"
    name="createUsername"
    [(ngModel)]="state.createUsername"
    required
    pattern="[a-zA-Z0-9_.-]{3,64}"
    minlength="3"
    maxlength="64"
    autocomplete="off"
  />
  <label for="create-password">Contraseña nueva (12–128 caracteres)</label>
  <input
    id="create-password"
    name="createPassword"
    type="password"
    [(ngModel)]="state.createPassword"
    required
    minlength="12"
    maxlength="128"
    autocomplete="new-password"
  />
  <fieldset>
    <legend>Confirma tu identidad</legend>
    <label for="admin-username">Tu username</label>
    <input
      id="admin-username"
      name="adminUsername"
      [(ngModel)]="state.adminUsername"
      required
      maxlength="64"
      autocomplete="username"
    />
    <label for="admin-password">Tu contraseña</label>
    <input
      id="admin-password"
      name="adminPassword"
      type="password"
      [(ngModel)]="state.adminPassword"
      required
      maxlength="128"
      autocomplete="current-password"
    />
  </fieldset>
  <button [disabled]="createForm.invalid || state.busy()">Crear administrador</button>
</form>
