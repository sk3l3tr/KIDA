<ion-content class="console-content">
  <div class="console-layout">
    <div>
      <p class="eyebrow">ADMINISTRACIÓN</p>
      <h1>Cuentas de usuario</h1>
      <p>Todos los usuarios son administradores.</p>
    </div>
    @if (state.error()) {
      <p class="error" role="alert">{{ state.error() }}</p>
    }
    @if (state.message()) {
      <p class="success" role="status">{{ state.message() }}</p>
    }
    <app-masonry>
      <section appMasonryItem class="panel" aria-labelledby="profile-title">
        <h2 id="profile-title">Mi cuenta</h2>
        <app-administrator-profile />
      </section>
      <section appMasonryItem class="panel" aria-labelledby="accounts-title">
        <h2 id="accounts-title">Administradores</h2>
        <app-administrator-list />
      </section>
      <section appMasonryItem class="panel" aria-labelledby="create-title">
        <h2 id="create-title">Crear administrador</h2>
        <app-administrator-create-form />
      </section>
    </app-masonry>
  </div>
</ion-content>
