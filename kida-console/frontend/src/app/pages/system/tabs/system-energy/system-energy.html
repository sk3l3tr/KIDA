<ion-content class="console-content">
  <main class="system-page">
    <app-masonry class="sensor-panels">
      <section appMasonryItem class="panel rtc-panel" aria-label="Capacidades RTC">
        <app-system-rtc-card [state]="state.wake" />
      </section>
      <section appMasonryItem class="panel power-panel" aria-label="Apagado y reinicio">
        <app-system-power-card />
      </section>
      <section appMasonryItem class="panel power-panel" aria-label="Ciclo de energía">
        <app-system-cycle-card />
      </section>
    </app-masonry>
  </main>
</ion-content>
