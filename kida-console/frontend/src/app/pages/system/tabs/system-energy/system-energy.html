<ion-content class="console-content">
  <main class="system-page energy-grid">
    <section class="panel rtc-panel" aria-label="Capacidades RTC">
      <app-system-rtc-card [state]="state.wake" (refresh)="state.refresh(state.wake)" />
    </section>
    <section class="panel power-panel" aria-label="Apagado y reinicio">
      <app-system-power-card />
    </section>
    <section class="panel power-panel" aria-label="Ciclo de energía">
      <app-system-cycle-card />
    </section>
    <section class="panel action-result" aria-label="Estado de la operación">
      <div aria-live="polite">
        @if (state.busy()) {
          <p>Confirmación o acción pendiente…</p>
        }
        @if (state.error()) {
          <p class="error" role="alert">{{ state.error() }}</p>
        }
        @if (state.result() !== null) {
          <h3>Resultado: {{ state.resultLabel() }}</h3>
          <app-system-data [value]="state.result()" />
        }
      </div>
    </section>
  </main>
</ion-content>
