<article class="fan-row">
  <div class="system-icon" [class.danger]="danger()" [class.stopped]="stopped()">
    <span class="i i-fan fan-blades" [class.spinning]="spinning()"></span>
  </div>
  <div class="fan-details">
    <strong>{{ display(reading().fields['label']) }}</strong>
    <small>{{ display(reading().fields['device']) }}</small>

    @if (reading().fields['status'] === 'OK') {
      <small class="primary">Sin fallo reportado</small>
    }
  </div>
  <div class="fan-speed">
    {{ display(reading().fields['value']) }} <small>{{ display(reading().fields['unit']) }}</small>
  </div>
</article>
