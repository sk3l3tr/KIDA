<ion-modal
  class="side-panel"
  [isOpen]="open()"
  [focusTrap]="focusTrap()"
  [enterAnimation]="enterAnimation"
  [leaveAnimation]="leaveAnimation"
  [attr.aria-label]="title()"
  (willPresent)="willPresent($event)"
  (didPresent)="focusClose()"
  (didDismiss)="didDismiss()"
  #modal
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <div class="panel-heading">
          @if (context()) {
            <p class="panel-context">{{ context() }}</p>
          }
          <h2 [title]="title()">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="panel-subtitle" [title]="subtitle()">{{ subtitle() }}</p>
          }
        </div>
        <ion-buttons slot="end">
          <ion-button #closeButton aria-label="Cerrar" (click)="modal.dismiss()">
            <span class="i i-close" aria-hidden="true"></span>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="panel-content"><ng-content /></div>
    </ion-content>
    <div class="panel-actions"><ng-content select="[panel-actions]" /></div>
  </ng-template>
</ion-modal>
