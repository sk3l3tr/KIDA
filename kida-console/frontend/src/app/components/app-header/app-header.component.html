<header class="app-header">
  <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
  <a href="/"> <strong>KIDA</strong><span class="mutted"> / Console</span></a
  ><span>{{ ownUsername() }}</span>
  <button type="button" class="secondary" [disabled]="busy()" (click)="logout()">

    <p class="error" role="alert">{{ error() }}</p>
  }
</header>
