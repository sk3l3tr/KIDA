[package]
license = "Apache-2.0"
name = "kida-core"
version = "0.0.5"
edition = "2024"

[dependencies]
sysinfo = "0.39"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
chrono = "0.4.45"
croner = "=3.0.1"
chrono-tz = "0.10.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
